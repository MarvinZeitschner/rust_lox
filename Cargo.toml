[package]
name = "rust_lox"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.26", features = ["derive"] }
thiserror = "2.0.11"
strum = { version = "0.27.1", features = ["derive"] }
ast_macro = { path = "ast_macro" }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
datatest-stable = "0.3.3"
regex = "1.11.1"

[profile.release]
debug = true

[profile.profiling]
inherits = "release"
debug = true

[[bench]]
name = "interpreter"
harness = false

# Keep `cargo bench` from running the libtest harness of the library and binary
[lib]
bench = false

[[bin]]
name = "rust_lox"
path = "src/main.rs"
bench = false

[[test]]
name = "integration"
harness = false
